<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>67 KID BRAINROT 💀🔥</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Permanent+Marker&display=swap" rel="stylesheet">
    
    <style>
        /* Base Reset & Hypnotic Background */
        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(124deg, #ff2400, #e81d1d, #e8b71d, #e3e81d, #1de840, #1ddde8, #2b1de8, #dd00f3, #dd00f3);
            background-size: 1800% 1800%;
            animation: rainbowBackground 6s ease infinite;
            font-family: 'Anton', sans-serif;
            user-select: none;
        }

        /* Background Animation */
        @keyframes rainbowBackground {
            0% { background-position: 0% 82% }
            50% { background-position: 100% 19% }
            100% { background-position: 0% 82% }
        }

        /* Overlay for a slight hypnotic vignette effect */
        .hypnotic-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, transparent 20%, rgba(0,0,0,0.6) 100%);
            pointer-events: none;
            z-index: 1;
        }

        #dvd-container {
            position: absolute;
            width: 45vw; /* Extremely large */
            min-width: 250px;
            max-width: 600px;
            z-index: 50;
            will-change: transform;
            /* Flexbox to keep the embed centered in the bounding box */
            display: flex;
            justify-content: center;
            align-items: center;
            filter: drop-shadow(0px 0px 30px rgba(255, 255, 255, 0.8));
        }

        /* The crazy spin & pulse effect on the meme itself */
        .meme-content {
            width: 100%;
            animation: brainrotPulse 1.5s infinite alternate ease-in-out, hueRotate 3s infinite linear;
            transform-origin: center;
        }

        @keyframes brainrotPulse {
            0% { transform: scale(1) rotate(-5deg); }
            50% { transform: scale(1.15) rotate(10deg); }
            100% { transform: scale(0.9) rotate(-15deg); }
        }

        @keyframes hueRotate {
            0% { filter: hue-rotate(0deg); }
            100% { filter: hue-rotate(360deg); }
        }

        .shaking-text {
            position: absolute;
            color: #ffffff;
            -webkit-text-stroke: 4px #000;
            text-transform: uppercase;
            z-index: 20;
            pointer-events: none;
            text-shadow: 6px 6px 0px #ff00ff, -6px -6px 0px #00ffff;
            animation: textShake 0.1s infinite;
        }

        .text-1 {
            top: 10%;
            left: 5%;
            font-size: 15vw;
            transform: rotate(-10deg);
            animation: textShake 0.15s infinite, colorFlash 1s infinite alternate;
        }

        .text-2 {
            bottom: 5%;
            right: 5%;
            font-size: 18vw;
            transform: rotate(5deg);
            animation: textShake 0.12s infinite reverse, colorFlash 0.8s infinite alternate-reverse;
        }

        /* Brainrot emojis floating in the background */
        .floating-emoji {
            position: absolute;
            font-size: 4rem;
            z-index: 10;
            opacity: 0.7;
            animation: floatUp 4s infinite linear;
        }

        @keyframes textShake {
            0% { transform: translate(3px, 2px) rotate(0deg); }
            20% { transform: translate(-3px, -2px) rotate(-3deg); }
            40% { transform: translate(-4px, 2px) rotate(2deg); }
            60% { transform: translate(4px, -2px) rotate(0deg); }
            80% { transform: translate(-2px, -3px) rotate(3deg); }
            100% { transform: translate(3px, 4px) rotate(-1deg); }
        }

        @keyframes colorFlash {
            0% { color: #fff; text-shadow: 6px 6px 0px #ff00ff, -6px -6px 0px #00ffff; }
            50% { color: #ffeb3b; text-shadow: -8px 8px 0px #ff0000, 8px -8px 0px #0000ff; }
            100% { color: #00e676; text-shadow: 6px -6px 0px #ff5722, -6px 6px 0px #9c27b0; }
        }

        @keyframes floatUp {
            0% { transform: translateY(110vh) rotate(0deg) scale(0.5); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% { transform: translateY(-10vh) rotate(360deg) scale(1.5); opacity: 0; }
        }

        /* Ensure the Tenor iframe fits our container exactly */
        .tenor-gif-embed {
            pointer-events: none; /* Prevents click interruptions while bouncing */
        }
    </style>
</head>
<body>

    <!-- Hypnotic dark vignette -->
    <div class="hypnotic-overlay"></div>

    <h1 class="shaking-text text-1">6-7!</h1>
    <h1 class="shaking-text text-2">SIX SEVEN</h1>

    <div id="dvd-container">
        <div class="meme-content">
            <!-- Tenor GIF Embed -->
            <div class="tenor-gif-embed" data-postid="6964163444357544932" data-share-method="host" data-aspect-ratio="1" data-width="100%"></div>
            <script type="text/javascript" async src="https://tenor.com/embed.js"></script>
        </div>
    </div>

    <!-- Container for dynamic brainrot emojis -->
    <div id="emoji-container"></div>

    <script>
        // 1. DVD Bounce Logic
        const dvdContainer = document.getElementById('dvd-container');
        
        // Initial Position (Centerish)
        let x = window.innerWidth / 2 - 150;
        let y = window.innerHeight / 2 - 150;
        
        // Speed & Direction
        let dx = 5; 
        let dy = 5;

        // Give it a random starting direction
        if (Math.random() > 0.5) dx = -dx;
        if (Math.random() > 0.5) dy = -dy;

        function animateBounce() {
            const rect = dvdContainer.getBoundingClientRect();
            const winWidth = window.innerWidth;
            const winHeight = window.innerHeight;

            // Check collision with right/left borders
            if (x + rect.width >= winWidth) {
                x = winWidth - rect.width;
                dx = -Math.abs(dx);
                addBrainrotImpact();
            } else if (x <= 0) {
                x = 0;
                dx = Math.abs(dx);
                addBrainrotImpact();
            }

            // Check collision with bottom/top borders
            if (y + rect.height >= winHeight) {
                y = winHeight - rect.height;
                dy = -Math.abs(dy);
                addBrainrotImpact();
            } else if (y <= 0) {
                y = 0;
                dy = Math.abs(dy);
                addBrainrotImpact();
            }

            // Update position
            x += dx;
            y += dy;
            
            // Apply new position via transform for better performance
            dvdContainer.style.transform = `translate(${x}px, ${y}px)`;

            requestAnimationFrame(animateBounce);
        }

        // Slight speed increase or flash effect when hitting the edge
        function addBrainrotImpact() {
            // Randomly flip the hue of the body briefly to simulate impact
            document.body.style.filter = `invert(${Math.random() * 0.3}) hue-rotate(${Math.random() * 90}deg)`;
            setTimeout(() => {
                document.body.style.filter = 'none';
            }, 50);
        }

        // Handle window resize dynamically to prevent getting stuck
        window.addEventListener('resize', () => {
            const rect = dvdContainer.getBoundingClientRect();
            if (x + rect.width > window.innerWidth) x = window.innerWidth - rect.width;
            if (y + rect.height > window.innerHeight) y = window.innerHeight - rect.height;
            if (x < 0) x = 0;
            if (y < 0) y = 0;
        });

        // 2. Dynamic Brainrot Emoji Spawner
        const emojis = ['💀', '😭', '🗣️', '🔥', '💯', '🗿', '🥶'];
        const emojiContainer = document.getElementById('emoji-container');

        function spawnEmoji() {
            const el = document.createElement('div');
            el.className = 'floating-emoji';
            el.innerText = emojis[Math.floor(Math.random() * emojis.length)];
            
            // Random horizontal start position
            el.style.left = Math.random() * 90 + 'vw';
            
            // Random size and duration
            const size = (Math.random() * 3 + 2) + 'rem';
            el.style.fontSize = size;
            
            const duration = (Math.random() * 3 + 2) + 's';
            el.style.animationDuration = duration;

            emojiContainer.appendChild(el);

            // Remove emoji after animation ends to prevent DOM overload
            setTimeout(() => {
                if (el.parentNode) {
                    el.parentNode.removeChild(el);
                }
            }, parseFloat(duration) * 1000);
        }

        // Start the animation loop when everything is ready
        window.onload = () => {
            animateBounce();
            // Spawn an emoji every 400ms
            setInterval(spawnEmoji, 400);
        };
    </script>
</body>
</html>
